services:
  rag-core-int:
    container_name: rag-core-int
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 默认使用已验证可拉取的 amd64 组合，优先保证跨架构构建成功。
        BUILDER_IMAGE: ${BUILDER_IMAGE:-maven:3.9.11-eclipse-temurin-25}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:25-jre}
        APP_VERSION: ${APP_VERSION:-0.2.9}
    image: rag-core-int:test
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LOG_DIR: /app/logs
      JAVA_OPTS: ${JAVA_OPTS:-}
      # Spring Boot 会自动把这些环境变量映射到对应配置项。
      RAG_DATASOURCE_METADATA_DIFY_URL: ${RAG_DATASOURCE_METADATA_DIFY_URL:-jdbc:postgresql://host.docker.internal:5432/dify}
      RAG_DATASOURCE_METADATA_DIFY_USERNAME: ${RAG_DATASOURCE_METADATA_DIFY_USERNAME:-postgres}
      RAG_DATASOURCE_METADATA_DIFY_PASSWORD: ${RAG_DATASOURCE_METADATA_DIFY_PASSWORD:-postgres}
      RAG_DATASOURCE_METADATA_DIFY_DRIVER_CLASS_NAME: org.postgresql.Driver
      # 回答侧对话记忆：常用只调 MEMORY_WINDOW_TURNS，高级预算按需调 CONTEXT/RATIO/SUMMARY。
      RAG_CHAT_MEMORY_ENABLED: ${RAG_CHAT_MEMORY_ENABLED:-true}
      RAG_CHAT_MEMORY_WINDOW_TURNS: ${RAG_CHAT_MEMORY_WINDOW_TURNS:-10}
      RAG_CHAT_MAX_REQUEST_CONTEXT_TOKENS: ${RAG_CHAT_MAX_REQUEST_CONTEXT_TOKENS:-32768}
      RAG_CHAT_MEMORY_TOKEN_BUDGET_RATIO: ${RAG_CHAT_MEMORY_TOKEN_BUDGET_RATIO:-0.2}
      RAG_CHAT_SUMMARY_ENABLED: ${RAG_CHAT_SUMMARY_ENABLED:-true}
      RAG_CHAT_SUMMARY_TRIGGER_TURNS: ${RAG_CHAT_SUMMARY_TRIGGER_TURNS:-10}
      RAG_CHAT_SUMMARY_MAX_TOKENS: ${RAG_CHAT_SUMMARY_MAX_TOKENS:-512}
      SPRING_AI_CHAT_MEMORY_REPOSITORY_JDBC_INITIALIZE_SCHEMA: ${SPRING_AI_CHAT_MEMORY_REPOSITORY_JDBC_INITIALIZE_SCHEMA:-always}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/rag}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-rag}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-cffex1001!}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # Agentic RAG 服务地址只配置协议、主机和端口，不要包含 /v1/runs。
      RAG_AGENTIC_ENABLED: ${RAG_AGENTIC_ENABLED:-true}
      RAG_AGENTIC_BASE_URL: ${RAG_AGENTIC_BASE_URL:-http://rag-agentic-int.internal:8000}
      RAG_AGENTIC_AUTH_TOKEN: ${RAG_AGENTIC_AUTH_TOKEN:-}
      RAG_AGENTIC_CONNECT_TIMEOUT: ${RAG_AGENTIC_CONNECT_TIMEOUT:-5s}
      RAG_AGENTIC_RUN_TIMEOUT: ${RAG_AGENTIC_RUN_TIMEOUT:-5m}
      MILVUS_URI: ${MILVUS_URI:-http://host.docker.internal:19530}
      MILVUS_USERNAME: ${MILVUS_USERNAME:-root}
      MILVUS_PASSWORD: ${MILVUS_PASSWORD:-Milvus}
      METADATA_CACHER_CACHE_TYPE: ${METADATA_CACHER_CACHE_TYPE:-in-memory}
      METADATA_CACHER_WARMUP_ENABLED: ${METADATA_CACHER_WARMUP_ENABLED:-true}
      METADATA_CACHER_DIFY_DEFAULT_TENANT_ID: ${METADATA_CACHER_DIFY_DEFAULT_TENANT_ID:-default}
      METADATA_CACHER_DIFY_DEFAULT_API_KEY: ${METADATA_CACHER_DIFY_DEFAULT_API_KEY:-}
      METADATA_CACHER_SCHEDULER_DIFY_DB_INITIAL_DELAY_MS: ${METADATA_CACHER_SCHEDULER_DIFY_DB_INITIAL_DELAY_MS:-5000}
      METADATA_CACHER_SCHEDULER_DIFY_DB_FIXED_DELAY_MS: ${METADATA_CACHER_SCHEDULER_DIFY_DB_FIXED_DELAY_MS:-30000}
      QUERY_PLANNER_DEFAULT_PLAN_TYPE: ${QUERY_PLANNER_DEFAULT_PLAN_TYPE:-standard_retrieval}
      QUERY_PLANNER_DEFAULTS_EMBEDDING_MODEL_ID: ${QUERY_PLANNER_DEFAULTS_EMBEDDING_MODEL_ID:-bge-m3-embedding}
      QUERY_PLANNER_DEFAULTS_RERANK_MODEL_ID: ${QUERY_PLANNER_DEFAULTS_RERANK_MODEL_ID:-bge-reranker-v2}
      QUERY_PLANNER_DEFAULTS_TOP_K: ${QUERY_PLANNER_DEFAULTS_TOP_K:-5}
      QUERY_PLANNER_DEFAULTS_CANDIDATE_K: ${QUERY_PLANNER_DEFAULTS_CANDIDATE_K:-20}
      RETRIEVAL_HTTP_CLIENT_MAX_CONNECTIONS: ${RETRIEVAL_HTTP_CLIENT_MAX_CONNECTIONS:-64}
      RETRIEVAL_HTTP_CLIENT_MAX_CONNECTIONS_PER_ROUTE: ${RETRIEVAL_HTTP_CLIENT_MAX_CONNECTIONS_PER_ROUTE:-32}
      APP_RAG_ANSWER_DEFAULT_LLM_MODEL: ${APP_RAG_ANSWER_DEFAULT_LLM_MODEL:-your-llm-model-name}
      APP_RAG_ANSWER_DEFAULT_SYSTEM_PROMPT: ${APP_RAG_ANSWER_DEFAULT_SYSTEM_PROMPT}
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      # macOS / Docker Desktop 下访问宿主机服务常用这个域名。
      - "host.docker.internal:host-gateway"
